[project]
name = "mcp-pdf-out-of-prompt"
version = "0.1.0"
description = "Personal MCP demo: Resources + app-only chunked PDF reads (AAIF Ambassador)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
mcp-pdf-demo = "mcp_pdf_demo.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
